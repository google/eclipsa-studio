name: OSV-Scanner

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  prepare:
    name: Extract pinned git commits
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate osv-scanner-custom.json from engine/deps/versions.env
        run: |
          source engine/deps/versions.env
          cat > osv-scanner-custom.json <<EOF
          {
            "results": [
              {
                "source": {
                  "path": "engine/deps/versions.env",
                  "type": "lockfile"
                },
                "packages": [
                  {
                    "package": {
                      "name": "${ECLIPSA_STUDIO_FFMPEG_REPO%.git}",
                      "ecosystem": "GIT",
                      "commit": "${ECLIPSA_STUDIO_FFMPEG_COMMIT}"
                    }
                  },
                  {
                    "package": {
                      "name": "${ECLIPSA_STUDIO_DAV1D_REPO%.git}",
                      "ecosystem": "GIT",
                      "commit": "${ECLIPSA_STUDIO_DAV1D_COMMIT}"
                    }
                  },
                  {
                    "package": {
                      "name": "${ECLIPSA_STUDIO_GPAC_REPO%.git}",
                      "ecosystem": "GIT",
                      "commit": "${ECLIPSA_STUDIO_GPAC_COMMIT}"
                    }
                  }
                ]
              }
            ]
          }
          EOF

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: osv-custom-inventory
          path: osv-scanner-custom.json
          retention-days: 1

  scan:
    name: OSV-Scanner
    needs: prepare
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      download-artifact: osv-custom-inventory
      scan-args: |-
        -r
        ./
