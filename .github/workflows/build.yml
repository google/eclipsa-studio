# Build and test on GitHub-hosted runners. This is the workflow of the
# public repository; the development repository runs its CI on self-hosted
# runners with a workflow that does not ship. It runs only where the
# repository variable PUBLIC_CI is "true", so it is skipped wherever that
# variable is unset. The `checks` job is cheap and runs on every push and pull
# request; the `macos` job builds the engine and runs every test suite,
# and runs on pushes to main and by hand only, because macOS minutes cost
# ten times Linux minutes on the free plan.

name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.5"

jobs:
  checks:
    name: Analyze and gates
    if: vars.PUBLIC_CI == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Release notes gate
        # Parses RELEASES.md; fails on macOS-only keyboard glyphs.
        run: scripts/release_notes.py json > /dev/null

      - name: Stamp version.dart
        # flutter analyze imports the gitignored generated/version.dart.
        run: ./build.sh gen-version

      - name: Flutter pub get
        run: flutter pub get
        working-directory: app

      - name: Dart format check
        run: dart format --output=none --set-exit-if-changed lib test
        working-directory: app

      - name: Design token drift gate
        # theme_tokens.dart is generated from app/design/tokens/ and committed.
        run: ./build.sh gen-tokens --check

      - name: Component index drift gate
        # component_index.dart is generated from app/design/components.json
        # and the call sites in app/lib/, and committed.
        run: ./build.sh gen-components --check

      - name: App icon drift gate
        # The brand SVGs, PNGs and platform icons are generated from
        # scripts/gen_app_icon.py and committed.
        run: ./build.sh gen-icon --check

      - name: Flutter analyze
        run: flutter analyze lib/
        working-directory: app

  macos:
    name: Engine and tests (macOS)
    if: vars.PUBLIC_CI == 'true' && github.event_name != 'pull_request'
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Bazel caches
        # The disk cache holds compiled actions, the repository cache the
        # downloaded archives; the git_override modules are cloned again
        # on a miss. The key changes with the module graph and the patches.
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/bazel-disk
            ~/.cache/bazel-repo
          key: bazel-${{ runner.os }}-${{ hashFiles('engine/MODULE.bazel', 'engine/.bazelversion', 'engine/deps/**/*.patch') }}
          restore-keys: |
            bazel-${{ runner.os }}-

      - name: Bazel cache settings
        run: |
          printf 'build --disk_cache=%s\nbuild --repository_cache=%s\n' \
            "$HOME/.cache/bazel-disk" "$HOME/.cache/bazel-repo" >> ~/.bazelrc

      - name: Vendored libgpac and FFmpeg
        # build.sh engine builds both from source once and stamps the
        # output with a hash of the recipe; the key mirrors that stamp.
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            engine/deps/gpac/lib
            engine/deps/gpac/include
            engine/deps/ffmpeg/lib
            engine/deps/ffmpeg/include
          key: native-${{ runner.os }}-${{ hashFiles('engine/deps/gpac/build_gpac.sh', 'engine/deps/gpac/patches/*.patch', 'engine/deps/ffmpeg/build_ffmpeg.sh') }}

      - name: Stamp version.dart
        run: ./build.sh gen-version

      - name: Flutter pub get
        run: flutter pub get
        working-directory: app

      - name: Build C++ engine
        # Vendors libgpac and FFmpeg on a cache miss, then
        # bazel build //:eclipsa_studio_engine.
        run: ./build.sh engine

      - name: Engine unit tests
        run: bazel test //...
        working-directory: engine

      - name: Flutter tests
        # After the engine build: the *_ffi_test.dart files drive the
        # dylib at engine/build/ when it exists and skip otherwise.
        run: flutter test
        working-directory: app
